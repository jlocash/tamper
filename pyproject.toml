[project]
name = "tamper"
version = "0.1.0"
description = "A framework for expressing the relationships between multimedia files as an RDF knowledge graph."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "fastmcp[tasks]>=3.4.4",
    "ffmpeg-python>=0.2.0",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "oxrdflib>=0.5.0",
    "pillow>=12.3.0",
    "pyshacl>=0.40.1",
    "pytest>=9.1.1",
    "python-magic>=0.4.27",
    "rdflib>=7.6.0",
    "reasonable>=0.4.4",
]

[project.optional-dependencies]
ray = ["ray>=2.56.1"]

[dependency-groups]
dev = ["pytest-cov>=6.0.0"]

[project.scripts]
tamper = "tamper.app.cli.main:app"

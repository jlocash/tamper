[project]
name = "tamper"
version = "0.1.0"
description = "A framework for expressing the relationships between multimedia files as an RDF knowledge graph."
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.14"
dependencies = [
    "fastmcp[tasks]>=3.4.5",
    "boto3>=1.43.63",
    "fastapi[standard]>=0.141.1",
    "ffmpeg-python>=0.2.0",
    "numpy>=2.5.1",
    "opencv-python>=5.0.0.93",
    "oxrdflib>=0.5.0",
    "pillow>=12.3.0",
    "pyshacl>=0.40.1",
    "pytest>=9.1.1",
    "pydantic-settings>=2.14.1",
    "python-magic>=0.4.27",
    "rdflib>=7.6.0",
    "reasonable>=0.4.4",
    "scalar-fastapi>=1.8.2",
]

[project.optional-dependencies]
ray = ["ray>=2.57.0"]

[dependency-groups]
dev = ["pytest-cov>=6.0.0"]

[project.scripts]
tamper = "tamper.app.cli.main:app"

[tool.fastapi]
entrypoint = "tamper.app.api.server:app"
